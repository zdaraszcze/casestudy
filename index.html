<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selected work</title>
<meta name="description" content="Selected work: enterprise UX in telecom, fintech, and regulated industries. Complex, data-heavy platforms redesigned into usable tools.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E9EDF2">
<meta property="og:title" content="Selected work: Enterprise UX">
<meta property="og:description" content="Complex, data-heavy enterprise platforms across telecom, fintech, and regulated industries.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body id="top">

<!-- Persistent top bar: name + LinkedIn (so the page identifies itself even when shared alone). -->
<nav class="nav" id="topnav">
  <a class="brand" href="#top"><span class="sdot ok"></span> <b data-site="name">—</b></a>
  <div class="nav-links">
    <a href="#work">Work</a>
    <a class="cta" data-site="linkedin" href="#" target="_blank" rel="noopener">LinkedIn ↗</a>
  </div>
</nav>

<!-- Floating side navigation: jump to any project. -->
<aside class="sidenav" id="sideNav" aria-label="Jump to project"><!-- injected --></aside>

<main>
  <!-- INTRO: name + reused bio + LinkedIn -->
  <section class="hero" id="intro"><!-- injected --></section>

  <!-- WORK: every case study inline, one shared template -->
  <div id="work"></div>
  <div id="cases"><!-- project sections injected --></div>

  <footer class="footer">
    <span class="fnote" data-site="footnote">—</span>
    <div class="flinks">
      <a href="#top">Top</a>
      <a data-site="linkedin" href="#" target="_blank" rel="noopener">LinkedIn ↗</a>
    </div>
  </footer>
</main>

<!-- IN-SITE FULL VIEW (never opens a new tab) — loads your untouched case-study / prototype files. -->
<div class="fv" id="fv" role="dialog" aria-modal="true" aria-label="Full view">
  <div class="fv-bar">
    <button class="fv-back" id="fvBack"><span aria-hidden="true">←</span> Back to work</button>
    <div class="fv-crumbs" id="fvCrumbs"></div>
    <span class="fv-spacer"></span>
    <span class="fv-count" id="fvCount" hidden></span>
    <button class="fv-close" id="fvClose" aria-label="Close full view">CLOSE <span aria-hidden="true">✕</span></button>
  </div>
  <div class="fv-body" id="fvBody"><!-- iframe or image viewer --></div>
</div>

<script src="assets/js/projects.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
