      .dao-root, .dao-root * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; }
      .dao-root { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; color: rgba(0,0,0,.88); }
      .dao-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
      .dao-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
      .dao-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.32); background-clip: content-box; }
      .dao-scroll::-webkit-scrollbar-track { background: transparent; }
      .dao-focus:focus-visible { outline: 2px solid #1677ff; outline-offset: 1px; border-radius: 4px; }

      @keyframes dao-scale { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
      @keyframes dao-slide { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
      @keyframes dao-toast { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes dao-shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
      @keyframes dao-spin { to { transform: rotate(360deg); } }
      @keyframes dao-scan { 0%,100% { top: 12%; } 50% { top: 82%; } }
      .dao-fade { animation: dao-fade .35s ease both; }
      .dao-scale { animation: dao-scale .22s ease both; }
      .dao-slide { animation: dao-slide .3s ease both; }
      .dao-skel { background: linear-gradient(90deg,#f5f5f5 25%,#e8e8e8 37%,#f5f5f5 63%); background-size: 800px 100%; animation: dao-shimmer 1.4s infinite linear; }
      @media (prefers-reduced-motion: reduce) {
        .dao-fade,.dao-scale,.dao-slide,.dao-skel { animation: none !important; }
