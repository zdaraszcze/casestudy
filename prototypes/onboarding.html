  toggleNav(){ S.navOpen=!S.navOpen; },
  toggleSwitcher(){ S.switcher=!S.switcher; if(S.switcher) S.focusNext='.panel__item[aria-current="true"]'; },
  persona(p){ S.persona=p; S.view=DEFAULT_VIEW[p]; S.switcher=false; S.navOpen=false; S.panel=null; closeAiPop(); },
  toggleTheme(){ document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; },
  toggleGuide(){ S.guide=!S.guide; if(S.guide) S.anim='guide'; },
  go(arg){
    const [p, view, id] = arg.split(':');
    S.persona=p; S.view=view||DEFAULT_VIEW[p]; if(id) S.caseId=id; S.tab='overview'; S.navOpen=false;
    if(window.innerWidth<1312) S.guide=false;
  },
  reset(){
    Object.assign(S, { persona:'advisor', view:'dashboard', caseId:null, tab:'overview', cases:freshCases(), modal:null, panel:null, briefs:{m1:'ready',m2:'idle'}, clientStep:0, clientActivated:false, clientData:{ consent:{data:false,esign:false,terms:false}, sowOk:false, exp:'', obj:'', horizon:'' }, clientTried:{}, search:'' });
    PROSPECTS.splice(5); PROSPECTS.forEach(p=>{ if(!['P-4471','P-4388'].includes(p.id)) delete p.caseId; }); _nextCase=20302; _nextProspect=4551;
    _clock = 9*60+2; toast('info','Demo reset','Both cases start again from the beginning.');
  },
  openCase(id){ S.persona='advisor'; S.view='case'; S.caseId=id; S.tab='overview'; },
  continueIntake(id){ S.persona='advisor'; S.view='intake'; S.caseId=id; },
  tab(k){ S.tab=k; },
  dismissToast(id){ S.toasts=S.toasts.filter(t=>t.id!==id); renderToasts(); return 'skip'; },

  /* start onboarding */
  openStart(){ S.panel={ type:'start', mode:'search', q:'', sel:null, form:{ name:'', dob:'', loc:'', seg:'' }, tried:false, dupHit:null, dupChoice:'existing' }; S.anim='panel'; S.focusNext='#start-q'; },
  startFor(id){ ACT.openStart(); const c=C(id); S.panel.sel=c.prospectId; S.panel.q=c.name; S.focusNext='.sidepanel__foot .btn:last-child'; },
  goStart(){ S.persona='advisor'; S.view='cases'; S.navOpen=false; if(window.innerWidth<1312) S.guide=false; ACT.startFor('KYC-20291'); },
  startMode(m){ S.panel.mode=m; S.panel.tried=false; S.focusNext = m==='new' ? '#start-name' : '#start-q'; },
  startSel(pid){ S.panel.sel=pid; },
  startSeg(v){ S.panel.form.seg=v; },
  startDup(v){ S.panel.dupChoice=v; },
  openCaseFromStart(id){ S.panel=null; ACT.openCase(id); },
  doStart(){
    const st=S.panel; st.tried=true;
    if(st.mode==='search'){ if(!st.sel) return; return launchCase(PROSPECTS.find(p=>p.id===st.sel),'reused'); }
    const f=st.form; if(!f.name.trim()||!f.dob||!f.loc||!f.seg) return;
    if(!st.dupHit){
      const m = PROSPECTS.find(p=>p.name.toLowerCase()===f.name.trim().toLowerCase().replace(/\s+/g,' '));
      if(m){ st.dupHit=m.id; st.dupChoice='existing'; return; }
    } else if(st.dupChoice==='existing'){
      const m = PROSPECTS.find(p=>p.id===st.dupHit);
      if(m.caseId && S.cases[m.caseId] && S.cases[m.caseId].stage!=='prospect'){ S.panel=null; ACT.openCase(m.caseId); toast('info','Onboarding already in progress',`${m.name} · ${m.caseId}`); return; }
      return launchCase(m,'reused');
    }
    const d = new Date(f.dob);
    const p = { id:'P-'+(_nextProspect++), name:f.name.trim().replace(/\s+/g,' '), loc:f.loc, seg:f.seg, dob: isNaN(d)?f.dob:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}), src:'Created by Marco Fischer' };
    PROSPECTS.push(p);
    return launchCase(p,'new');
  },

  /* intake */
  goStep(i){
    const c=C(S.caseId), to=+i;
    // moving forward: the step being left must still be valid
    if(to>c.step){
      c.triedContinue[c.step]=true;
      if(!stepValid(c,c.step)) return;
      if(c.step===3 && !sowAssess(c).sufficient){ S.modal={type:'sowWarn', target:to}; S.anim='modal'; S.focusNext='.modal__foot .btn:last-child'; return; }
    }
    goTo(c,to);
  },
  stepBack(id){ const c=C(id); goTo(c, Math.max(0,c.step-1)); },
  stepNext(id){
    const c=C(id), s=c.step; c.triedContinue[s]=true;
    if(!stepValid(c,s)) return;
    if(s===3 && !sowAssess(c).sufficient){ S.modal={type:'sowWarn', target:4}; S.anim='modal'; S.focusNext='.modal__foot .btn:last-child'; return; }
    if(s===5){
      if(c.clientConfirmed){
        c.stage='edd'; logIt(c,'Marco Fischer','Submitted to EDD review with source-of-wealth gap closed');
        toast('success','Submitted to EDD review','Due Diligence has the case.');
      } else {
        c.stage='client'; logIt(c,'Marco Fischer',`Intake complete. JPB app invitation sent to ${c.first}`);
        toast('success',`Invitation sent to ${c.first}`,'JPB app invitation and activation code sent.');
      }
      S.view='case'; return;
    }
    goTo(c, s+1);
  },
  sowAnyway(){ const c=C(S.caseId); goTo(c, S.modal.target||4); S.modal=null; logIt(c,'Marco Fischer','Continued past source-of-wealth gaps'); },
  dupCheck(id){ C(id).dupChecked=true; },
  dup(v){ C(S.caseId).dup=v; },
  uploadCopy(id){ const c=C(id); c.copy='reading'; later(2400, ()=>{ c.copy='done'; S.anim='scan'; logIt(c,'Marco Fischer','Passport copy uploaded; details extracted by Document AI'); }); },
  screenOpen(id){ const c=C(id); c.screenOpen=!c.screenOpen; },
  fieldsChecked(id, checked){ C(id).fieldsChecked=checked; },
  verify(arg){
    const [id,v]=arg.split(':'); const c=C(id); c.verify=v;
    if(v==='app'){ c.verifyStatus='pending'; c.handoff=null; return; }
    if(c.verifyStatus==='verified' && c.verifiedHow==='person') return;
    c.verifyStatus='pending'; c.handoff='waiting';
    later(2600, ()=>{ if(c.verify!=='person'||c.handoff!=='waiting') return; c.handoff='reading';
      later(2600, ()=>{ if(c.verify!=='person'||c.handoff!=='reading') return; c.handoff=null; c.verifyStatus='verified'; c.verifiedHow='person'; logIt(c,'Marco Fischer','Identity verified in person; passport chip read on work phone'); }); });
  },
  email(v){ C(S.caseId).email=v; },
  pep(id){ const c=C(id); c.pep='running'; later(1500, ()=>{ c.pep='done'; logIt(c,'Screening','PEP and sanctions screening completed; results saved to case'); }); },
  upload(arg){
    const [id, doc] = arg.split(':'); const c=C(id); const d=c.docs.find(x=>x.id===doc);
    d.status='checking';
    later(1200, ()=>{ d.status='verified'; logIt(c,'EDD assistant',`${d.name} uploaded; document type and names confirmed`); if(S.view==='intake') S.focusNext='#sow-text'; });
  },
  sowSuggest(id){ const c=C(id); c.sow=SOW_AI_TEXT[id]; c.sowAi=true; c.sowAiText=c.sow; c.sowEdited=false; S.focusNext='#sow-text'; },
  sowRevert(id){ const c=C(id); c.sow=c.sowAiText; c.sowEdited=false; S.focusNext='#sow-text'; },
  fav(arg){ const [id,k]=arg.split(':'); const c=C(id); c.fav=k; c.products={...PRODUCT_PRESETS[k]}; },
  prod(arg, checked){
    const c=C(S.caseId); const parts=arg.split(':');
    const groups={ bank:['current','cards','fx'], inv:['custody','advisory'] };
    if(parts[0]==='parent') groups[parts[1]].forEach(k=>c.products[k]=checked);
    else c.products[parts[2]]=checked;
    c.fav = null;
  },
  reviewed(id, checked){ C(id).reviewed=checked; },
  rfiDone(arg){ const [id,i]=arg.split(':'); const c=C(id); c.rfi[+i].done=true; logIt(c,'Marco Fischer',`Added: ${c.rfi[+i].label}`); },
  rfiReturn(id){ const c=C(id); c.stage='edd'; logIt(c,'Marco Fischer','Returned requested items to EDD review'); toast('success','Returned to EDD review','Due Diligence has been notified.'); },

  /* meetings */
  genBrief(m){ S.briefs[m]='loading'; later(1400, ()=>{ S.briefs[m]='ready'; }); },
  brief(m){ S.modal={type:'brief', arg:m}; S.anim='modal'; S.focusNext='.modal__foot .btn:last-child'; },
  regenBrief(){ toast('info','Brief regenerated','Built from the latest case data.'); S.modal=null; },

  /* modals / panels */
  openModal(type){ S.modal={ type, ok:false, tried:false, reason:'' }; S.anim='modal'; S.focusNext='.modal input, .modal select, .modal__foot .btn:last-child'; },
  closeModal(){ S.modal=null; },
  closeModalBg(arg, el, e){ if(e.target===el) S.modal=null; else return 'skip'; },
  openPanel(type){ S.panel={ type, sel:{}, note:'', tried:false }; S.anim='panel'; S.focusNext='.sidepanel input'; },
  closePanel(){ S.panel=null; },
  aiPop(key, el, e){ if(e) e.preventDefault(); showAiPop(key, el); return 'skip'; },
  aiClose(){ const a=S.aiAnchor; closeAiPop(); if(a && document.body.contains(a)) a.focus(); return 'skip'; },

  /* client */
  consent(k, checked){ S.clientData.consent[k]=checked; },
  clientSow(_, checked){ S.clientData.sowOk=checked; },
  clientRadio(arg){ const [k,v]=arg.split(':'); S.clientData[k]=v; },
  clientBack(){ S.clientStep=Math.max(0,S.clientStep-1); },
  clientNext(){
    const d=S.clientData, st=S.clientStep; S.clientTried[st]=true;
    const ok = [ ()=>d.consent.data&&d.consent.terms, ()=>wei().idDone, ()=>true, ()=>d.sowOk, ()=>d.exp&&d.obj&&d.horizon, ()=>true ][st]();
    if(!ok) return;
    if(st===5){
      const c=wei(); c.day=1; c.clientConfirmed=true; c.stage='edd';
      logIt(c,'Jonathan Wei','Confirmed details, source of wealth and consents in JPB app','08:14');
      c.day=2; logIt(c,'System','Case routed to EDD review','09:00');
      toast('success','Application submitted','Our compliance team reviews it next.');
      return;
    }
    S.clientStep=st+1;
  },
  activate(){ S.clientActivated=true; S.focusNext='.phone h1'; },
  appVerify(){ const c=wei(); c.idBusy=true; later(3300, ()=>{ c.idBusy=false; c.idDone=true; c.idMethod='app'; c.verifyStatus='verified'; c.verifiedHow='app'; c.day=1; logIt(c,'Jonathan Wei','Identity verified in JPB app: passport chip, selfie and liveness; matches advisor\'s copy','08:06'); }); },
  clientMsg(){ toast('info','Message sent to Marco','He usually replies within the day.'); return 'toastOnly'; },
  idMethod(v){ wei().idMethod=v; },
  idVerify(){ const c=wei(); c.idBusy=true; later(c.idMethod==='online'?2600:1500, ()=>{ c.idBusy=false; c.idDone=true; logIt(c,'Jonathan Wei', c.idMethod==='online'?'Identified online':'Identified by video call'); }); },
  signAgree(_, checked){ wei().signAgree=checked; },
  sign(){
    const c=wei(); c.signTried=true; if(!c.signAgree) return;
    c.day=7; c.stage='restricted';
    logIt(c,'Jonathan Wei','Signed 5 documents electronically','10:21');
    logIt(c,'Automated','Account and custody opening triggered in Core Banking','10:22');
    logIt(c,'Automated','PICH GF115 triggered from recorded risk flags','10:22');
    logIt(c,'Automated','Documents tagged to archive via QR codes','10:23');
    toast('success','Documents signed','Your account is being opened.');
  },
  simAccess(){ const c=wei(); c.day=10; c.stage='live'; logIt(c,'Core Banking','Overnight verification complete; access activated','06:00'); toast('success','Access activated','Jonathan Wei is live on D10.'); },

  /* DDO */
  review(id){ S.persona='ddo'; S.view='review'; S.caseId=id; },
  apprOk(_, checked){ S.modal.ok=checked; },
  doApprove(){
    const m=S.modal; m.tried=true; if(!m.ok) return;
    const c=C(S.caseId);
    if(c.commentEdited) logIt(c,'Nathalie Morel','Edited the AI-drafted EDD comment');
    logIt(c,'Nathalie Morel','Approved (sign-off 1 of 14); audit record sealed');
    if(c.id==='KYC-20291'){ c.day=5; }
    logIt(c,'Approval chain','Sign-offs 2 to 14 completed','16:40');
    c.stage='formalities'; c.decision='Approved'; S.modal=null;
    toast('success','Case approved','Sent to sign-off 2 of 14.');
  },
  decReason(){},
  doDecline(){
    const m=S.modal; m.tried=true; if(!m.reason) return;
    const c=C(S.caseId); c.stage='declined'; c.decision='Declined'; S.modal=null;
    logIt(c,'Nathalie Morel',`Declined: ${({sow:'source of wealth not plausible',risk:'risk outside appetite',other:'other'})[m.reason]}`);
    toast('error','Case declined','The advisor has been notified.');
  },
  rfiSel(arg, checked){
    const sel=S.panel.sel, p=arg.split(':');
    const g=RFI_GROUPS.find(x=>x.id===p[1]);
    if(p[0]==='parent') g.children.forEach(ch=>sel[ch.id]=checked); else sel[p[2]]=checked;
  },
  sendRfi(){
    const sel=S.panel.sel; const items=RFI_GROUPS.flatMap(g=>g.children).filter(ch=>sel[ch.id]);
    if(!items.length){ S.panel.tried=true; return; }
    const c=C(S.caseId); c.rfi=items.map(i=>({ label:i.label, done:false })); c.rfiNote=S.panel.note; c.stage='rfi'; c.decision='Information requested';
    logIt(c,'Nathalie Morel',`Requested ${items.length} specific item${items.length===1?'':'s'} from the advisor`);
    S.panel=null; toast('info','Request sent','Marco Fischer has been notified.');
  },
  cmtRevert(id){ const c=C(id); c.comment=eddComment(c); c.commentEdited=false; S.focusNext='#cmt'; },

  /* specialist */
  formal(id){ S.persona='specialist'; S.view='formal'; S.caseId=id; },
  genPackage(id){
    const c=C(id); c.formal='running'; c.formalProgress=0;
    const tick = () => { c.formalProgress++; if(c.formalProgress>=PACKAGE_STEPS.length){ c.formal='done'; logIt(c,'Sophie Brunner','Document package generated and pre-checked; 1 item flagged'); } else later(700,tick); };
    later(700, tick);
  },
  resolveExc(v){ const c=C(S.caseId); c.exc='resolved'; S.modal=null; logIt(c,'Sophie Brunner', v==='fix'?'Address block corrected to verified format':'Address block accepted as generated'); },
  formalReviewed(id, checked){ C(id).formalReviewed=checked; },
  sendSigning(id){
    const c=C(id); c.formalTried=true; if(c.exc==='open'||!c.formalReviewed) return;
    c.formal='sent'; c.stage='signing'; if(c.id==='KYC-20291') c.day=6;
    logIt(c,'Sophie Brunner','Package reviewed and sent for signing'); toast('success','Sent for signing',`${c.first} can sign from the secure link.`);
  }
};

function launchCase(p, dup){
  let c = p.caseId && S.cases[p.caseId];
  if(c && c.stage!=='prospect'){ S.panel=null; ACT.openCase(c.id); return; }
  if(!c){ c = caseFromProspect(p); S.cases[c.id]=c; }
  Object.assign(c, { stage:'intake', step:1, dup, dupChecked:true });
  logIt(c,'Marco Fischer',`Started onboarding from prospect record ${p.id}`);
  S.panel=null; S.persona='advisor'; S.view='intake'; S.caseId=c.id; S.focusNext='#main h1';
  toast('success','Onboarding started',`${c.id} opened for ${c.name}.`);
}
function stepValid(c,s){
  return [ ()=>c.dupChecked&&c.dup, ()=>c.copy==='done'&&c.fieldsChecked&&c.verify&&(c.verify==='app'||c.verifyStatus==='verified')&&c.email, ()=>c.pep==='done', ()=>true, ()=>Object.values(c.products).some(Boolean), ()=>c.reviewed ][s]();
}
function goTo(c,to){ c.maxStep=Math.max(c.maxStep||0, c.step, to); c.step=to; S.focusNext='#main h1'; }
/* ================= EVENTS ================= */
document.documentElement.dataset.theme='light';
document.addEventListener('click', e=>{
  const pop = document.getElementById('aipop');
  if(S.aiPop && pop && !pop.contains(e.target) && !e.target.closest('.ai-label')) closeAiPop();
  const el = e.target.closest('[data-act]');
  if(S.switcher && !e.target.closest('.panel') && !(el && el.dataset.act==='toggleSwitcher')){ S.switcher=false; if(!el){ render(); return; } }
  if(!el) return;
  if(el.tagName==='INPUT') return; // handled on change
  if(el.disabled || el.getAttribute('aria-disabled')==='true') return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  const r = fn(el.dataset.arg, el, e);
  if(r==='skip'||r==='toastOnly') return;
  render();
});
document.addEventListener('change', e=>{
  const el = e.target; if(!el.matches('input[data-act]')) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  fn(el.dataset.arg, el.type==='checkbox'?el.checked:true);
  render();
});
document.addEventListener('input', e=>{
  const el = e.target; const b = el.dataset && el.dataset.bind; if(!b) return;
  if(b==='sow'){ const c=C(el.dataset.arg); c.sow=el.value; if(c.sowAi) c.sowEdited = el.value!==c.sowAiText; updateSowLive(c); }
  else if(b==='comment'){ const c=C(el.dataset.arg); c.comment=el.value; c.commentEdited = el.value!==eddComment(c); el.classList.toggle('ai-field', !c.commentEdited); const m=document.getElementById('cmt-meta'); if(m) m.innerHTML=commentMeta(c); }
  else if(b==='search'){ S.search=el.value; render(); }
  else if(b==='rfiNote'){ S.panel.note=el.value; }
  else if(b==='startQ'){ S.panel.q=el.value; S.panel.sel=null; S.panel.tried=false; render(); }
  else if(b==='startName'){ S.panel.form.name=el.value; S.panel.dupHit=null; }
  else if(b==='startDob'){ S.panel.form.dob=el.value; }
  else if(b==='startLoc'){ S.panel.form.loc=el.value; }
  else if(b==='decReason'){ S.modal.reason=el.value; }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(S.aiPop){ ACT.aiClose(); return; }
    if(S.modal){ S.modal=null; render(); return; }
    if(S.panel){ S.panel=null; render(); return; }
    if(S.switcher){ S.switcher=false; S.focusNext='.header__action[aria-haspopup]'; render(); return; }
    if(S.navOpen){ S.navOpen=false; render(); return; }
  }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('tr[data-act]')){ e.preventDefault(); e.target.click(); }
});
window.addEventListener('resize', ()=>{ if(S.aiPop) closeAiPop(); });

render();


</script>
</body>
</html>
